# Frontend server (172.28.92.56) — Laravel app + Nginx (DB on 172.28.92.57)
# Usage: docker compose -f docker-compose.frontend.yml up -d --build
# Set APP_HTTP_PORT in .env or below; ensure .env has DB_HOST=172.28.92.57

services:
  app:
    image: frontend-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crc_dev_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-172.28.92.57}
      - DB_PORT=${DB_PORT:-5002}
      - DB_DATABASE=${DB_DATABASE:-greenresource}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - crc_frontend_network

  nginx:
    image: nginx:alpine
    container_name: crc_dev_nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8010}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crc_frontend_network
    depends_on:
      - app

networks:
  crc_frontend_network:
    driver: bridge
